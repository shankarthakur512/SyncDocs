name: CI

# Runs on every push to main and on every pull request.
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
 
  app:
    name: App (typecheck · test · build)
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://user:pass@localhost:5432/db?schema=public"
      DIRECT_URL: "postgresql://user:pass@localhost:5432/db?schema=public"
      AUTH_SECRET: "ci-placeholder-secret-please-ignore"
      AUTH_TRUST_HOST: "true"
      AUTH_GOOGLE_ID: "ci-dummy"
      AUTH_GOOGLE_SECRET: "ci-dummy"
      SYNC_JWT_SECRET: "ci-dummy-sync-secret"
      NEXT_PUBLIC_SYNC_WS_URL: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` runs the postinstall `prisma generate`, producing the client.
      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests (with coverage)
        run: npm run test:coverage

      - name: Build
        run: npm run build

  
  sync-server:
    name: Sync server (typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sync-server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Type-check
        run: npm run typecheck
